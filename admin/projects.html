<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Projects</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">Phúc's Portfolio Admin</div>
                <ul class="nav-links">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="projects.html" class="active">Projects</a></li>
                    <li><a href="certificates.html">Certificates</a></li>
                    <li><a href="messages.html">Messages</a></li>
                    <li><a href="../index.html">View Site</a></li>
                    <li><a href="#" id="logout-btn">Logout</a></li>
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </nav>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Manage Projects</h1>
            <div class="admin-actions">
                <button id="add-project-btn" class="btn">Add New Project</button>
            </div>
        </div>

        <div class="admin-card" id="project-form-container" style="display: none;">
            <h2 class="admin-form-title">Add New Project</h2>
            <form id="project-form">
                <div class="form-group">
                    <label for="title">Project Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" required></textarea>
                </div>
                <div class="file-input-container">
                    <label class="file-input-label" for="project-images">Project Images</label>
                    <input type="file" id="project-images" name="images" accept="image/*" multiple required>
                    <div class="file-preview-container" id="images-preview"></div>
                </div>
                <button type="submit" class="btn">Save Project</button>
                <button type="button" id="cancel-project-btn" class="btn"
                    style="background-color: #6c757d;">Cancel</button>
            </form>
        </div>

        <div class="admin-card">
            <h2>Projects List</h2>
            <div id="projects-table-container">
                <p class="loading">Loading projects...</p>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/projects.js"></script>
</body>

</html>
