<html lang="en">

<head>
    <meta charset="UTF-8" />

<body>
    <header>

            <nav>
                <div class="logo">Phúc's Portfolio Admin</div>
                <ul class="nav-links">

                    <li><a href="projects.html">Projects</a></li>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">TikTok Video Manager</h1>
        </div>

        <div class="admin-card">
            <h2>Upload TikTok Link</h2>
            <form id="tiktok-form">
                <input type="url" id="tiktok-link" placeholder="Enter TikTok video URL..." required />
                <button type="submit" class="btn">Upload</button>
            </form>
        </div>

        <div class="admin-card">
            <h2>Uploaded TikTok Clips</h2>
            <ul id="tiktok-list" class="video-list">
                <li>Loading...</li>
            </ul>
        </div>
    </div>

    <script src="../js/api.js"></script>
